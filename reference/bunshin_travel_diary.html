const R = 6371, toR = x => x * Math.PI / 180;
function havP(a, b) {
  const dLat = toR(b[0]-a[0]), dLon = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const cum = [0];
for (let i = 1; i < track.length; i++) cum[i] = cum[i-1] + havP(track[i-1], track[i]);
const LOOP = cum[cum.length-1];
function project(st) {
  const cosLat = Math.cos(toR(st.lat));
  let bestD = Infinity, bestS = 0;
  for (let i = 0; i < track.length - 1; i++) {
    const ax = track[i][1]*cosLat, ay = track[i][0];
    const bx = track[i+1][1]*cosLat, by = track[i+1][0];
    const px = st.lon*cosLat, py = st.lat;
    const dx = bx-ax, dy = by-ay, len2 = dx*dx + dy*dy || 1e-12;
    let u = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / len2));
    const d = Math.hypot(px - (ax+u*dx), py - (ay+u*dy));
    if (d < bestD) { bestD = d; bestS = cum[i] + u * (cum[i+1] - cum[i]); }
  }
  return bestS;
}
const sPos = stations.map(project);
function latLngAt(s) {
  s = ((s % LOOP) + LOOP) % LOOP;
  let lo = 0, hi = track.length - 1;
  while (lo < hi - 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
  const seg = cum[hi] - cum[lo] || 1e-12, u = (s - cum[lo]) / seg;
  return [track[lo][0] + (track[hi][0]-track[lo][0])*u, track[lo][1] + (track[hi][1]-track[lo][1])*u];
}

  div.className = "card " + e.type;
  div.dataset.i = i;
  const stLink = '<a href="https://ja.wikipedia.org/wiki/Special:Search?search=' + encodeURIComponent(stations[e.st].name + '駅') + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + stations[e.st].name + '</a>';
  div.innerHTML = '<div class="meta"><span class="time">' + e.t + '</span><span class="st">' + stLink +
    '</span><span class="tag">' + (e.type === "stop" ? "途中下車" : "車窓から") + '</span></div><p>' + e.text + '</p>';
  div.onclick = () => focusEntry(i);
  return div;
}

function highlight(i) {
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", +c.dataset.i === i));
  const e = diary[i];
  stMarkers[e.st].setStyle({ fillColor: e.type === "stop" ? "#e8a33d" : "#cfd8b0" });
}

function focusEntry(i) {
  stopPlay();
  const e = diary[i];
  curArc = sPos[e.st] < sPos[diary[0].st] && i > 0 ? sPos[e.st] + LOOP : sPos[e.st];
  const p = latLngAt(curArc);
  avatar.setLatLng(p); map.panTo(p);
  highlight(i);
}

function moveAvatarTo(targetArc, done) {
  const startArc = curArc;
  const delta = targetArc - startArc;
  const dur = Math.min(2600, 500 + Math.abs(delta) * 350);
  const t0 = performance.now();
  function step(now) {
    const u = Math.min(1, (now - t0) / dur);
    const ease = u < .5 ? 2*u*u : 1 - Math.pow(-2*u+2, 2)/2;
    const s = startArc + delta * ease;
    const p = latLngAt(s);
    avatar.setLatLng(p); map.panTo(p, { animate: false });
    if (u < 1 && playing) animId = requestAnimationFrame(step);
    else { curArc = targetArc; if (playing) done(); }
  }
  animId = requestAnimationFrame(step);
}

function playNext() {
  if (shownCount >= diary.length) { finish(); return; }
  const i = shownCount, e = diary[i];
  let target = sPos[e.st];
  while (target < curArc - 1e-9) target += LOOP; // 常に前進 (一周して戻る場合も対応)
  moveAvatarTo(target, () => {
    const card = makeCard(e, i);
    $("diary").appendChild(card);
    requestAnimationFrame(() => card.classList.add("shown"));
    card.scrollIntoView({ behavior: "smooth", block: "end" });
    highlight(i);
    shownCount++;
    setTimeout(() => { if (playing) playNext(); }, e.type === "stop" ? 2600 : 1500);
  });
}

function finish() {
  stopPlay();
  $("fin").style.display = "block";
  $("playBtn").textContent = "↺ 最初から";
  shownCount = 0;
}

function stopPlay() {
  playing = false;
  if (animId) cancelAnimationFrame(animId);
  $("playBtn").textContent = shownCount === 0 ? "▶ 旅を再生" : "▶ 続きを再生";
}

$("playBtn").onclick = () => {
  if (playing) { stopPlay(); return; }
  if (shownCount === 0) {
    $("diary").innerHTML = ""; $("fin").style.display = "none";
    stMarkers.forEach(m => m.setStyle({ fillColor: "#fff" }));
    curArc = sPos[diary[0].st];
    avatar.setLatLng(latLngAt(curArc));
  }
  playing = true;
  $("playBtn").textContent = "⏸ ひと休み";
  playNext();
};

$("allBtn").onclick = () => {
  stopPlay();
  $("diary").innerHTML = "";
  diary.forEach((e, i) => {
    const card = makeCard(e, i);
    $("diary").appendChild(card);
    requestAnimationFrame(() => card.classList.add("shown"));
    stMarkers[e.st].setStyle({ fillColor: e.type === "stop" ? "#e8a33d" : "#cfd8b0" });
  });
  shownCount = diary.length;
  $("fin").style.display = "block";
  $("playBtn").textContent = "↺ 最初から";
  shownCount = 0;
  focusEntry(diary.length - 1);
  $("diary").scrollTop = 0;
};
</script>
</body>
</html>
